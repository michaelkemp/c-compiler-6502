[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c6502"
version = "0.0.1"
description = "A 6502 emulator, assembler, and C compiler toolchain"
requires-python = ">=3.11"
readme = "CLAUDE.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
c6502-run = "c6502.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: exercises the full Klaus Dormann 6502 functional test suite (~30M steps, ~1-2 min; requires scripts/fetch_dormann_tests.sh first) or booting/running real Microsoft BASIC (~15s; requires scripts/fetch_msbasic.sh + build_msbasic.sh first)",
]
addopts = "-m 'not slow'"
